# 데모 스택 단일 입구 — 8099(채팅 UI) / 8098(CSV 다운로드)
# 컨테이너(librechat, energy-mcp)는 포트를 직접 공개하지 않고 여기만 거친다.
events {}

http {
    # LibreChat 스트리밍(SSE)·웹소켓 업그레이드용
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8099;
        client_max_body_size 25m;

        location /approval/ {
            # URI를 붙이지 않아 /approval/<token> 경로를 그대로 upstream에 전달한다.
            # IP·principal 매핑은 아직 도입하지 않는다. 승인 권한은 URL bearer token만 쓴다.
            proxy_pass http://energy-mcp:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            access_log off; # URL bearer token을 access log에 남기지 않는다
        }

        location / {
            proxy_pass http://librechat:3080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # SSE 토큰 스트리밍이 버퍼에 갇히지 않게
            proxy_buffering off;
            proxy_read_timeout 300s;
        }
    }

    server {
        listen 8098;

        location / {
            # 디렉토리 목록 차단은 upstream(serve_exports.py)이 404 로 처리
            proxy_pass http://energy-mcp:8098;
        }
    }
}
