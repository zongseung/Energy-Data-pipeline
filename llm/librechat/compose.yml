# LibreChat 운영 조회 — 조건 구체화 → SQL 승인 → 실행.
# (로컬 Qwen 스택은 2026-08-21 제거 — GPU/CUDA 복구 시 git 역사에서 복원)
#
#   docker compose -f llm/librechat/compose.yml up -d --build
#   브라우저: http://<tailnet-IP>:8099  (Tailscale 연결 후 직접 가입)
#
# 외부 입구는 nginx 하나다: 8099(UI) / 8098(CSV). 내부 서비스는 포트 미공개.
# DB 접속은 PgBouncer(session 풀링)를 거친다 — 동시 접속자가 늘어도 pv-db
# 커넥션은 DEFAULT_POOL_SIZE 로 캡핑된다.
#
# OPENAI_API_KEY 는 같은 디렉토리의 librechat.env 에 넣는다(git 미추적).
# user_provided 로 두면 각 사용자가 UI 설정에서 자기 키를 입력해야 한다.
#
# 주의: 질문·DB 조회 결과가 OpenAI 로 전송된다 — 폐쇄망 전제가 깨지는 지점.
# 프로젝트명 고정 — 폴더를 docker/llm-demo 에서 옮겼어도
# 돌고 있는 llm-demo-* 컨테이너를 계속 관리하도록.
name: llm-demo

services:
  nginx:
    image: nginx:alpine
    container_name: llm-demo-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    # Tailscale 주소에만 바인딩한다. 0.0.0.0 이면 사내 LAN 에서도 열려서
    # 가입을 열 수 없었다 — 문지기를 Tailscale 초대 승인 하나로 모은다.
    ports:
      - "${DEMO_HOST:-100.127.20.105}:8099:8099"  # 채팅 UI
      - "${DEMO_HOST:-100.127.20.105}:8098:8098"  # CSV 다운로드
    depends_on:
      - librechat
      - energy-mcp
    networks:
      - pvnet
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: llm-demo-pgbouncer
    environment:
      DB_HOST: pv-db
      DB_PORT: "5432"
      # 슈퍼유저 pv 대신 research 스키마만 읽는 demo_ro 로 붙는다.
      # PgBouncer 는 평문 목록에 있는 계정만 통과시키므로 여기와 DSN 이 같아야 한다.
      DB_USER: demo_ro
      DB_PASSWORD: ${DEMO_RO_PW:?llm/librechat/.env 에 DEMO_RO_PW 를 넣어라}
      DB_NAME: pv
      # energy-mcp 가 세션 설정(read-only, statement_timeout)을 쓰므로
      # transaction 풀링은 불가 — session 모드로 커넥션 재사용·캡핑만 얻는다.
      POOL_MODE: session
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "200"
      # 내부 도커망 전용이라 평문 인증 (pv-db 의 scram 과의 불일치 회피)
      AUTH_TYPE: plain
    networks:
      - pvnet
    restart: unless-stopped

  energy-mcp:
    build:
      context: ../..
      dockerfile: llm/librechat/mcp.Dockerfile
    container_name: energy-mcp
    # planner용 API key와 workflow MongoDB 계정만 주입한다(비밀값, git 미추적).
    env_file: [mcp.env]
    environment:
      ENERGY_MCP_MODE: workflow
      ENERGY_MCP_APPROVAL_BASE_URL: http://${DEMO_HOST:-100.127.20.105}:8099/approval
      ENERGY_MCP_DSN: postgresql://demo_ro:${DEMO_RO_PW:?llm/librechat/.env 에 DEMO_RO_PW 를 넣어라}@pgbouncer:5432/pv
      ENERGY_MCP_TRANSPORT: streamable-http
      ENERGY_MCP_HOST: 0.0.0.0
      # 채팅 미리보기 행 수 — 컨텍스트 절약. 초과분은 CSV 다운로드로 제공된다.
      ENERGY_MCP_ROW_LIMIT: "10"
      ENERGY_MCP_EXPORT_DIR: /exports
      # 2026년 전체 태양광이 ~20만 행이라 기본 상한(10만)으로는 잘린다
      ENERGY_MCP_EXPORT_ROW_LIMIT: "300000"
      # 다운로드 링크는 접속하는 PC 기준 주소여야 한다 — 위 포트 바인딩과
      # 같은 DEMO_HOST 를 쓴다.
      ENERGY_MCP_EXPORT_URL: http://${DEMO_HOST:-100.127.20.105}:8098
    volumes:
      - exports:/exports
    depends_on:
      - pgbouncer
      - mongodb
    networks:
      - pvnet
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: librechat-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - pvnet
    restart: unless-stopped

  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.7
    container_name: librechat
    depends_on:
      - mongodb
      - energy-mcp
    env_file: librechat.env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      ENDPOINTS: openAI,agents
      OPENAI_MODELS: gpt-4o-mini
      SEARCH: "false"             # Meilisearch 미기동 — 데모에 검색 불필요
      # Tailscale 에 초대된 사람만 8099 에 닿으므로 가입은 열어둔다.
      # (초대 승인이 곧 심사다 — 구글 폼 서약을 보고 관리자가 승인한다)
      ALLOW_REGISTRATION: "true"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
    networks:
      - pvnet
    restart: unless-stopped

volumes:
  exports:
  mongo-data:

networks:
  pvnet:
    external: true
    name: pv-pipeline-network
