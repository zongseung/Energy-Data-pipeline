[project]
name = "energy-mcp"
version = "0.1.0"
description = "연구원용 읽기전용 에너지 데이터 MCP 서버 (Postgres research 스키마 위에 얹는 stdio 서버)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.28,<2",
    "psycopg2-binary>=2.9",
]

[project.scripts]
energy-mcp = "energy_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["energy_mcp"]
