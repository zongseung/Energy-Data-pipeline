services:
  # ==============================
  # Prefect PostgreSQL (PV 전용)
  # ==============================
  pv-prefect-postgres:
    image: postgres:14
    container_name: pv-prefect-postgres
    environment:
      - POSTGRES_USER=prefect
      - POSTGRES_PASSWORD=prefect
      - POSTGRES_DB=prefect
    volumes:
      - pv_prefect_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U prefect"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pv-network

  # ==============================
  # PV DB (태양광 발전 데이터 저장용)
  # ==============================
  pv-db:
    image: postgres:14
    container_name: pv-data-postgres
    environment:
      - POSTGRES_USER=pv
      - POSTGRES_PASSWORD=pv
      - POSTGRES_DB=pv
    volumes:
      - /mnt/iscsi-renewable/postgres/pv-data-postgres:/var/lib/postgresql/data
      # 기상청 동네예보 3종(단기예보·초단기예보·초단기실황) NAS SMB 마운트.
      # research.forecast() 가 호출 시점에 필요한 파일만 읽는다 — 적재하지 않는다
      # (전량은 약 225억 행이라 이 LUN 에 들어가지도 않는다).
      # :ro 필수 — DB 가 NAS 원본을 건드릴 이유가 없다.
      - /mnt/nvme/weather-data/nas-weather:/nas-weather:ro
      # 시간별 유가 CSV. 수집기(flow 컨테이너)가 /app/data/oil 에 쓰고 여기서
      # file_fdw 로 읽는다 — 같은 호스트 경로를 양쪽이 가리켜야 성립한다.
      # 적재본이 없으므로 수집 즉시 조회에 반영된다. sql/research/oil_fdw.sql 참조.
      - /mnt/nvme/Energy-Data-pipeline/data/oil:/oil-data:ro
    ports:
      - "5436:5432"  # 호스트에서 localhost:5436으로 접속
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pv"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pv-network

  # ==============================
  # Prefect Server (PV 전용)
  # ==============================
  pv-prefect-server:
    image: prefecthq/prefect:2-python3.10
    container_name: pv-prefect-server
    ports:
      # localhost 전용 — UI 는 이 호스트에서만 본다 (무인증이라 망 노출 금지)
      - "127.0.0.1:4400:4200"
    environment:
      - PREFECT_SERVER_API_HOST=0.0.0.0
      - PREFECT_API_DATABASE_CONNECTION_URL=postgresql+asyncpg://prefect:prefect@pv-prefect-postgres:5432/prefect
    command: >
      bash -c "
        apt-get update &&
        apt-get install -y curl &&
        prefect server start
      "
    depends_on:
      pv-prefect-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4200/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - pv-network

  # 배포/등록용 컨테이너 (한 번 실행되었다가 종료됨)
  pv-deployer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: pv-pipeline:latest
    container_name: pv-deployer
    env_file:
      - ../.env
    environment:
      - PREFECT_API_URL=http://pv-prefect-server:4200/api
      - PV_DATABASE_URL=postgresql+psycopg2://pv:pv@pv-db:5432/pv
      - TZ=Asia/Seoul
    working_dir: /app
    depends_on:
      pv-prefect-server:
        condition: service_healthy
      pv-db:
        condition: service_healthy
    networks:
      - pv-network
    command: >
      bash -c "
        echo 'Waiting 15s for Prefect API...' &&
        sleep 15 &&
        python -m prefect_flows.deploy
      "

  # 실제 flow 돌리는 Docker Worker
  pv-worker:
    image: prefecthq/prefect:2-python3.10
    container_name: pv-pipeline-worker
    env_file:
      - ../.env
    environment:
      - PREFECT_API_URL=http://pv-prefect-server:4200/api
      - PREFECT_WORK_POOL=pv-pool
      - PV_DATABASE_URL=postgresql+psycopg2://pv:pv@pv-db:5432/pv
      - TZ=Asia/Seoul
    privileged: true
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: >
      bash -c "
        echo 'Installing compatible pydantic & prefect-docker...' &&
        pip install 'pydantic<2.11' &&
        pip install 'prefect-docker<0.5.0,>=0.3.0' &&
        pip install 'aiohttp' &&
        echo 'Starting Prefect docker worker...' &&
        prefect worker start --type docker --pool pv-pool
      "
    depends_on:
      pv-prefect-server:
        condition: service_healthy
      pv-db:
        condition: service_healthy
    networks:
      - pv-network

volumes:
  pv_prefect_postgres_data:
  pv_data_postgres:

networks:
  pv-network:
    driver: bridge
    name: pv-pipeline-network
