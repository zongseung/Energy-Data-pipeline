# 한시 데모 스택 — LibreChat + OpenAI gpt-4o-mini + energy-mcp.
# (Qwen 로컬 스택 compose.yml 의 임시 대체 — GPU/CUDA 복구 전까지.
#  둘은 8098/8099 포트를 공유하므로 동시에 띄울 수 없다.)
#
#   docker compose -f docker/llm-demo/compose.librechat.yml up -d --build
#   브라우저: http://<서버IP>:8099  (첫 접속 시 계정 등록 후 로그인)
#
# OPENAI_API_KEY 는 같은 디렉토리의 librechat.env 에 넣는다(git 미추적).
# user_provided 로 두면 각 사용자가 UI 설정에서 자기 키를 입력해야 한다.
#
# 주의: 질문·DB 조회 결과가 OpenAI 로 전송된다 — 폐쇄망 전제가 깨지는 지점.
services:
  energy-mcp:
    build:
      context: ../..
      dockerfile: docker/llm-demo/mcp.Dockerfile
    container_name: energy-mcp
    environment:
      ENERGY_MCP_DSN: postgresql://pv:pv@pv-db:5432/pv
      ENERGY_MCP_TRANSPORT: streamable-http
      ENERGY_MCP_HOST: 0.0.0.0
      # 채팅 미리보기 행 수 — 컨텍스트 절약. 초과분은 CSV 다운로드로 제공된다.
      ENERGY_MCP_ROW_LIMIT: "10"
      ENERGY_MCP_EXPORT_DIR: /exports
      # 2026년 전체 태양광이 ~20만 행이라 기본 상한(10만)으로는 잘린다
      ENERGY_MCP_EXPORT_ROW_LIMIT: "300000"
      # 다운로드 링크는 접속하는 PC 기준 주소여야 한다. 기본값은 LAN IP,
      # Tailscale 로 보는 사람에게는 DEMO_HOST=100.127.20.105 로 띄울 것.
      ENERGY_MCP_EXPORT_URL: http://${DEMO_HOST:-192.9.65.58}:8098
    volumes:
      # compose.yml(Qwen 스택)과 같은 프로젝트(llm-demo)라 exports 볼륨을
      # 공유한다 — 이미 나눠준 CSV 링크가 스택을 바꿔도 살아 있다.
      - exports:/exports
    ports:
      - "8098:8098"  # CSV 다운로드
    networks:
      - pvnet
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: librechat-mongo
    volumes:
      - mongo-data:/data/db
    networks:
      - pvnet
    restart: unless-stopped

  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.7
    container_name: librechat
    depends_on:
      - mongodb
      - energy-mcp
    env_file: librechat.env
    environment:
      HOST: 0.0.0.0
      MONGO_URI: mongodb://mongodb:27017/LibreChat
      ENDPOINTS: openAI,agents
      OPENAI_MODELS: gpt-4o-mini
      SEARCH: "false"          # Meilisearch 미기동 — 데모에 검색 불필요
      ALLOW_REGISTRATION: "true"
    volumes:
      - ./librechat.yaml:/app/librechat.yaml:ro
    ports:
      - "8099:3080"
    networks:
      - pvnet
    restart: unless-stopped

volumes:
  exports:
  mongo-data:

networks:
  pvnet:
    external: true
    name: pv-pipeline-network
