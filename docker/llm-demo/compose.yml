# LLM 데모 스택 — LibreChat + OpenAI gpt-4o-mini + energy-mcp.
# 외부 입구는 nginx 하나다: 8099(UI) / 8098(CSV). 내부 서비스는 포트 미공개.
# 질문·DB 조회 결과가 OpenAI 로 전송된다 — 폐쇄망 전제가 깨지는 지점.
services:
  nginx:
    image: nginx:alpine
    container_name: llm-demo-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8099:8099"
      - "8098:8098"
    depends_on:
      librechat:
        condition: service_healthy
      energy-mcp:
        condition: service_healthy
    networks:
      - pvnet
    restart: unless-stopped

  pgbouncer:
    image: edoburu/pgbouncer
    container_name: llm-demo-pgbouncer
    entrypoint: ["/usr/local/bin/load-secrets", "pgbouncer", "/entrypoint.sh"]
    command: ["/usr/bin/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    environment:
      DB_HOST: pv-db
      DB_PORT: "5432"
      DB_USER: demo_ro
      DB_NAME: pv
      POOL_MODE: session
      DEFAULT_POOL_SIZE: "20"
      MAX_CLIENT_CONN: "200"
      AUTH_TYPE: plain
    volumes:
      - ./load-secrets.sh:/usr/local/bin/load-secrets:ro
    secrets:
      - postgres_readonly_password
    networks:
      - pvnet
    restart: unless-stopped

  energy-mcp:
    build:
      context: ../..
      dockerfile: docker/llm-demo/mcp.Dockerfile
    container_name: energy-mcp
    environment:
      ENERGY_MCP_MODE: workflow
      ENERGY_MCP_TRANSPORT: streamable-http
      ENERGY_MCP_HOST: 0.0.0.0
      ENERGY_MCP_APPROVAL_BASE_URL: ${LLM_PUBLIC_BASE_URL:?LLM_PUBLIC_BASE_URL을 설정하세요}/approval
      ENERGY_MCP_PLANNER_MODEL: gpt-4o-mini
      ENERGY_MCP_ROW_LIMIT: "10"
      ENERGY_MCP_EXPORT_DIR: /exports
      ENERGY_MCP_EXPORT_ROW_LIMIT: "300000"
      ENERGY_MCP_EXPORT_URL: ${LLM_PUBLIC_BASE_URL:?LLM_PUBLIC_BASE_URL을 설정하세요}:8098
    volumes:
      - exports:/exports
    secrets:
      - openai_api_key
      - energy_mcp_dsn
      - energy_mcp_mongo_password
    depends_on:
      mongodb:
        condition: service_healthy
      pgbouncer:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pvnet
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: librechat-mongo
    # mongod --auth keeps every non-local connection behind Mongo authentication.
    # 기존 mongo-data는 전체 스택보다 먼저 ./bootstrap-mongo.sh를 한 번 실행한다.
    command: ["mongod", "--auth", "--bind_ip_all"]
    volumes:
      - mongo-data:/data/db
      - ./init-mongo-users.js:/docker-entrypoint-initdb.d/init-mongo-users.js:ro
      - ./mongo-healthcheck.js:/usr/local/share/mongo-healthcheck.js:ro
    secrets:
      - mongo_root_password
      - librechat_mongo_password
      - energy_mcp_mongo_password
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--file", "/usr/local/share/mongo-healthcheck.js"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pvnet
    restart: unless-stopped

  librechat:
    image: ghcr.io/danny-avila/librechat:v0.8.7
    container_name: librechat
    entrypoint: ["/usr/local/bin/load-secrets", "librechat"]
    command: ["npm", "run", "backend"]
    environment:
      HOST: 0.0.0.0
      ENDPOINTS: openAI,agents
      OPENAI_MODELS: gpt-4o-mini
      SEARCH: "false"
      ALLOW_REGISTRATION: "false"
    volumes:
      - ./load-secrets.sh:/usr/local/bin/load-secrets:ro
      - ./librechat.yaml:/app/librechat.yaml:ro
    secrets:
      - openai_api_key
      - jwt_secret
      - jwt_refresh_secret
      - creds_key
      - creds_iv
      - librechat_mongo_password
    depends_on:
      mongodb:
        condition: service_healthy
      energy-mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - pvnet
    restart: unless-stopped

volumes:
  exports:
  mongo-data:

networks:
  pvnet:
    external: true
    name: pv-pipeline-network

secrets:
  openai_api_key:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/openai_api_key"
  jwt_secret:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/jwt_secret"
  jwt_refresh_secret:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/jwt_refresh_secret"
  creds_key:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/creds_key"
  creds_iv:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/creds_iv"
  postgres_readonly_password:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/postgres_readonly_password"
  energy_mcp_dsn:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/energy_mcp_dsn"
  mongo_root_password:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/mongo_root_password"
  librechat_mongo_password:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/librechat_mongo_password"
  energy_mcp_mongo_password:
    file: "${LLM_SECRET_DIR:?LLM_SECRET_DIR를 설정하세요}/energy_mcp_mongo_password"
